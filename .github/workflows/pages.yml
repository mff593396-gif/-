# ينشر index.html وحده على GitHub Pages عند كل دمج في main.
# أدوات صاحب المشروع (tools/) ومجلد المهارات لا تُنشر.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # يعيد حساب بصمات السكربتات في سياسة CSP، فلا يتعطل الموقع إذا عُدّل الملف من واجهة GitHub
      - name: Refresh CSP hashes
        run: python3 tools/update-csp.py

      - name: Prepare site
        run: |
          mkdir _site
          cp index.html _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
